<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب قوة المضخة</title>
    <!-- ربط ملف CSS الخارجي -->
    <link rel="stylesheet" href="nourane.css"> 
</head>
<body>

    <div class="container">
        <h1>حساب قوة المضخة</h1>

        <div class="input-group">
            <label for="flow">معدل التدفق (م)</label>
            <input type="number" id="flow" placeholder="أدخل معدل التدفق">
        </div>

        <div class="input-group">
            <label for="waterLevel">منسوب الماء (متر)</label>
            <input type="number" id="waterLevel" placeholder="أدخل منسوب الماء">
        </div>

        <div class="input-group">
            <label for="drop">الانخفاض (متر)</label>
            <input type="number" id="drop" placeholder="أدخل الانخفاض">
        </div>

        <button onclick="calculatePower()">احسب القوة</button>

        <div class="result-box">
            القدرة المضخة بالحصان (cv): <strong id="hpOutput">0.00</strong>
        </div>
    </div>

    <!-- ربط ملف JavaScript الخارجي -->
    <script src="nourane.js"></script>

</body>
</html>
